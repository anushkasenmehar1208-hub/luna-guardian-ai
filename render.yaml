services:
  - type: web
    name: luna-guardian-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LUNA_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: luna-guardian-db
          property: connectionString
      - key: LUNA_AUTH_TOKEN
        generateValue: true
      - key: LUNA_AUTH_USER_ID
        value: luna-submission-demo
      - key: LUNA_AGENT_PROVIDER
        value: openai-compatible
      - key: LUNA_OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LUNA_OPENAI_MODEL
        value: gemini-3.1-flash-lite
      - key: LUNA_AGENT_TOOL_TRANSPORT
        value: mcp

databases:
  - name: luna-guardian-db
    plan: free
    databaseName: luna_guardian
    user: luna_guardian
