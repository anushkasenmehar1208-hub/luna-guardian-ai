services:
  - type: web
    name: luna-guardian-ai
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      - key: LUNA_ENV
        value: production
      - key: LUNA_DB_PATH
        value: /var/data/luna.db
      - key: LUNA_AUTH_TOKEN
        generateValue: true
      - key: LUNA_AUTH_USER_ID
        value: demo-student
      - key: LUNA_AGENT_PROVIDER
        value: local
    disk:
      name: luna-data
      mountPath: /var/data
      sizeGB: 1
