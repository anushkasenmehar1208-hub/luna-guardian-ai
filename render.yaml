services:
  - type: web
    name: luna-guardian-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LUNA_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: luna-guardian-db
          property: connectionString
      - key: LUNA_AUTH_TOKEN
        generateValue: true
      - key: LUNA_AUTH_USER_ID
        value: demo-student
      - key: LUNA_AGENT_PROVIDER
        value: local

databases:
  - name: luna-guardian-db
    plan: free
    databaseName: luna_guardian
    user: luna_guardian
